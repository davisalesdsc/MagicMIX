name: Build e testes

# A cada push: testa o protótipo em Python (fase 1).
#
# Quando o plugin em C++ entrar (fase 2), este workflow ganha os jobs de
# compilação, instaladores e Release, no mesmo modelo do BandChatLIVE: com tudo
# passando na main, o CI cria/atualiza a Release da versão escrita em VERSAO.
# Versão nova = mudar o VERSAO.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  prototipo:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: prototipo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: prototipo/requirements.txt
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Render de ponta a ponta (sem LLM)
        run: |
          python scripts/make_test_audio.py audio
          python -m promptfx render examples/voz_calorosa.json audio/voz_sintetica.wav -o audio/saida_voz.wav --match-loudness
          python -m promptfx render examples/exagerado.json audio/pad_brilhante.wav -o audio/saida_exagerado.wav
          python -m promptfx render examples/gerados/pad_sonhador_llm.json audio/pad_brilhante.wav -o audio/saida_pad.wav
          python -m promptfx render examples/gerados/conversa/voz_pop_turno2.json audio/voz_sintetica.wav -o audio/saida_conversa.wav --match-loudness
          python -m promptfx render examples/gerados/bumbo_na_cara.json audio/bateria_sintetica.wav -o audio/saida_bumbo.wav --mix 0.8 --stereo
          python -m promptfx render examples/gerados/so_sugestoes.json audio/pad_brilhante.wav -o audio/nao_gravado.wav
